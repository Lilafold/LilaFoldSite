<!doctype html>

<head>
<!-- Google tag (GTM-TRTQ4D6N): Google Analytics via Google Tag Manager.
     Consent mode v2: everything starts denied and gtm.js is only fetched once the
     visitor accepts analytics in the cookie banner (stored as lf-consent). -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied'
  });
  gtag('js', new Date());
  window.lfLoadAnalytics = function () {
    gtag('consent', 'update', { analytics_storage: 'granted' });
    if (window.lfGtmLoaded) return;
    window.lfGtmLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-TRTQ4D6N';
    document.head.appendChild(s);
  };
  try { if (localStorage.getItem('lf-consent') === 'granted') window.lfLoadAnalytics(); } catch (e) {}
</script>
